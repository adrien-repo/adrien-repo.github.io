<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PureText</title>
<link href="data:image/x-icon;base64,AAABAAEAEBACAAAAAACwAAAAFgAAACgAAAAQAAAAIAAAAAEAAQAAAAAAQAAAAAAAAAAAAAAAAgAAAAAAAAAAAAAA////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYAAAAAAAAACQAAAAAAAAAAAAADwDwAA+B8AAPw/AADsNwAAzDMAAMQjAADkJwAA4AcAAPAPAAD4HwAA8A8AAPAPAADwDwAA8A8AAPAPAADwDwAA" rel="icon" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Theme ---------- */
:root {
  color-scheme: light;
  --paper:#FFFFFF; --ink:#000000; --ink-soft:#5A5A5A; --faint:#8C8C8C; --panel:#F7F7F7; --line:#E3E3E3;
  --link:#0B57D0; --accent:#0B57D0; --chip:#EEF0F2;
  --hl:#FDF0C4; --hl-line:#E9C44A; --hl-strong:#F8DC7A;
  --t0b:#ECEEF1; --t0f:#3C4043; --t1b:#D9E6FD; --t1f:#0B4AB0; --t2b:#FBEBC0; --t2f:#6B4E00;
  --t3b:#D3ECDB; --t3f:#0D5A2A; --t4b:#F9D8D5; --t4f:#9A1B12; --t5b:#E8DEFB; --t5f:#4F2A93;
  --font:"Roboto","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --paper:#121212; --ink:#FFFFFF; --ink-soft:#B0B0B0; --faint:#7A7A7A; --panel:#1E1E1E; --line:#2E2E2E;
    --link:#8AB4F8; --accent:#8AB4F8; --chip:#26282B; --hl:rgba(250,204,21,.16); --hl-line:rgba(250,204,21,.55); --hl-strong:rgba(250,204,21,.34);
    --t0b:#2A2C2F; --t0f:#D5D7DA; --t1b:#16305C; --t1f:#B6CFFB; --t2b:#3D3210; --t2f:#F3D98B; --t3b:#133A22; --t3f:#A6DDB8; --t4b:#4A1714; --t4f:#F4B4AE; --t5b:#2E2150; --t5f:#CDB9F7; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --paper:#121212; --ink:#FFFFFF; --ink-soft:#B0B0B0; --faint:#7A7A7A; --panel:#1E1E1E; --line:#2E2E2E;
  --link:#8AB4F8; --accent:#8AB4F8; --chip:#26282B; --hl:rgba(250,204,21,.16); --hl-line:rgba(250,204,21,.55); --hl-strong:rgba(250,204,21,.34);
  --t0b:#2A2C2F; --t0f:#D5D7DA; --t1b:#16305C; --t1f:#B6CFFB; --t2b:#3D3210; --t2f:#F3D98B; --t3b:#133A22; --t3f:#A6DDB8; --t4b:#4A1714; --t4f:#F4B4AE; --t5b:#2E2150; --t5f:#CDB9F7; }

*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ scroll-behavior:smooth; scroll-padding-top:90px; }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }
body{ margin:0; background:var(--paper); color:var(--ink); font:400 16px/1.65 var(--font); -webkit-font-smoothing:antialiased; }
button, input, select, textarea{ font:inherit; color:inherit; }
a{ color:var(--ink); text-decoration:none; }
:focus-visible{ outline:2px solid var(--link); outline-offset:2px; }
.muted{ color:var(--faint); }

/* ---------- Layout ---------- */
.page-wrap{ max-width:1440px; margin:0 auto; padding:0 clamp(16px,3vw,32px) 80px; display:grid; grid-template-columns:230px minmax(0,1fr) 280px; gap:48px; }
.page-wrap.no-rail{ grid-template-columns:230px minmax(0,1fr); max-width:1180px; }
.page-wrap.no-rail .rail{ display:none; }

/* ---------- Left column: tabs + outline ---------- */
.browse{ position:sticky; top:0; align-self:start; padding-top:48px; font-size:.9rem; max-height:100vh; overflow:auto; padding-bottom:24px; }
.browse p.label{ font-weight:500; margin:0 0 20px; font-size:1.1rem; border-bottom:1px solid var(--faint); padding-bottom:8px; cursor:text; }
.browse p.label:hover{ color:var(--ink-soft); }
.browse p.label[contenteditable="true"]{ outline:1px dashed var(--faint); outline-offset:4px; border-radius:2px; color:var(--ink); }
.side-head{ display:flex; align-items:center; justify-content:space-between; color:var(--faint); font-size:.8rem; margin:0 0 6px; }
.side-head button{ border:0; background:none; cursor:pointer; color:var(--ink-soft); font-size:1.1rem; line-height:1; padding:2px 6px; border-radius:4px; }
.side-head button:hover{ background:var(--panel); color:var(--ink); }
.side-sec{ margin-bottom:26px; }
.browse ul{ list-style:none; margin:0; padding:0; }
.tab-item{ display:flex; align-items:center; border-radius:5px; padding-left:calc(var(--d,0) * 14px); }
.tab-item.drop{ box-shadow:inset 0 2px 0 var(--accent); }
.tab-btn{ flex:1; min-width:0; text-align:left; border:0; background:none; padding:5px 8px; cursor:pointer; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:5px; }
.tab-item:hover .tab-btn{ color:var(--ink); }
.tab-item.active .tab-btn{ color:var(--ink); font-weight:500; background:var(--panel); }
.tab-more{ border:0; background:none; cursor:pointer; color:var(--faint); padding:2px 6px; border-radius:4px; opacity:0; }
.tab-item:hover .tab-more, .tab-item.active .tab-more, .tab-more:focus-visible{ opacity:1; }
.tab-more:hover{ color:var(--ink); background:var(--panel); }
.outline li{ margin-bottom:2px; }
.outline li button{ display:block; width:100%; text-align:left; border:0; background:none; padding:3px 0; color:var(--ink-soft); cursor:pointer; font-size:.88rem; line-height:1.4; }
.outline li button:hover{ color:var(--ink); text-decoration:underline; }
.outline li button.h1-link{ font-weight:500; color:var(--ink); margin-top:6px; }
.outline li button.h2-link{ padding-left:12px; }
.outline li button.h3-link{ padding-left:24px; font-size:.84rem; }

/* ---------- Editor column ---------- */
article{ min-width:0; max-width:820px; padding-top:48px; position:relative; }
.mobile-tabs{ display:none; }

.toolbar{ margin-bottom:28px; position:sticky; top:16px; z-index:20; }
.toolbar-toggle{ display:none; }
.toolbar-content{ display:flex; flex-wrap:nowrap; gap:4px; background:var(--panel); padding:4px 6px; overflow-x:auto; scrollbar-width:none; border-radius:6px; box-shadow:0 2px 4px rgba(0,0,0,.1); align-items:center; }
.toolbar-content .group{ display:flex; gap:0; border-right:1px solid var(--line); padding-right:4px; align-items:center; flex:none; }
.toolbar-content .group:last-child{ border-right:none; padding-right:0; }
.toolbar-content button{ border:1px solid transparent; background:transparent; border-radius:4px; padding:0 6px; height:30px; min-width:28px; display:inline-flex; align-items:center; justify-content:center; gap:4px; cursor:pointer; font-size:.86rem; font-weight:500; color:var(--ink); white-space:nowrap; }
.toolbar-content button:hover{ background:var(--faint); color:var(--paper); }
.toolbar-content button.on{ background:var(--ink); color:var(--paper); }
.toolbar-content select{ border:0; background:transparent; font-size:.86rem; font-weight:500; padding:4px 2px; border-radius:4px; cursor:pointer; }
.toolbar-content select:hover{ background:var(--line); }
#rail-btn{ min-width:30px; padding:0 4px; }
.toolbar-content .ic{ width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.toolbar-content::-webkit-scrollbar{ display:none; }
#rail-btn .n{ display:inline-block; min-width:18px; padding:0 5px; border-radius:9px; background:var(--hl-strong); color:var(--ink); font-size:.76rem; }

.findbar{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--panel); border-radius:6px; padding:8px 10px; margin:-16px 0 24px; position:sticky; top:66px; z-index:19; font-size:.86rem; }
.findbar input[type=text]{ border:1px solid var(--line); background:var(--paper); border-radius:4px; padding:4px 8px; width:170px; }
.findbar button{ border:0; background:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-weight:500; }
.findbar button:hover{ background:var(--line); }
#f-count{ color:var(--faint); min-width:64px; }
::highlight(pt-find){ background-color:#FDE68A; color:#000; }
::highlight(pt-cur){ background-color:#F59E0B; color:#000; }

/* ---------- Page content ---------- */
.editor-page{ color:var(--ink); width:100%; min-height:70vh; outline:none; padding-bottom:60px; }
.editor-page h1{ font-weight:500; font-size:clamp(1.9rem,3.8vw,2.5rem); line-height:1.1; margin:0 0 16px; letter-spacing:-.015em; }
.editor-page h2{ font-weight:500; font-size:1.5rem; line-height:1.3; margin:34px 0 10px; }
.editor-page h3{ font-weight:500; font-size:1.15rem; line-height:1.35; margin:26px 0 8px; }
.editor-page p, .editor-page ul, .editor-page ol, .editor-page li{ margin:0 0 14px; }
.editor-page li{ margin-bottom:6px; }
.editor-page li > ul, .editor-page li > ol{ margin:6px 0 0; }
.editor-page a{ color:var(--link); text-decoration:underline; text-underline-offset:2px; }
.editor-page blockquote{ margin:0 0 14px; padding:2px 0 2px 16px; border-left:3px solid var(--line); color:var(--ink-soft); }
.editor-page code{ font-family:var(--mono); font-size:.88em; background:var(--panel); padding:1px 5px; border-radius:4px; }
.editor-page hr{ border:0; border-top:1px solid var(--line); margin:28px 0; }
.editor-page hr.page-break{ border-top:1px dashed var(--faint); position:relative; overflow:visible; }
.editor-page hr.page-break::after{ content:"Page break"; position:absolute; left:50%; top:-10px; transform:translateX(-50%); background:var(--paper); color:var(--faint); font-size:.72rem; padding:0 8px; }
.editor-page img{ max-width:100%; }
.byline{ color:var(--ink-soft); font-size:.92rem; margin-top:-4px !important; }

/* Tasks */
ul.tasks{ list-style:none; padding-left:0; }
li.task{ position:relative; padding-left:28px; }
li.task::before{ content:""; position:absolute; left:2px; top:.34em; width:15px; height:15px; border:1.5px solid var(--ink-soft); border-radius:3px; cursor:pointer; background:var(--paper); }
li.task[data-done="1"]::before{ background:var(--accent); border-color:var(--accent); }
li.task[data-done="1"]::after{ content:""; position:absolute; left:7px; top:calc(.34em + 2px); width:4px; height:8px; border:solid var(--paper); border-width:0 2px 2px 0; transform:rotate(45deg); pointer-events:none; }
li.task[data-done="1"]{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--faint); }

/* Chips */
.chip{ display:inline-flex; align-items:center; gap:5px; padding:0 7px; border-radius:4px; background:var(--chip); font-size:.86em; line-height:1.65; cursor:pointer; user-select:none; white-space:nowrap; text-decoration:none; font-weight:400; vertical-align:baseline; }
.chip:hover{ filter:brightness(.96); }
.chip.date::before{ content:""; width:9px; height:9px; border:1.5px solid currentColor; border-top-width:3px; border-radius:2px; opacity:.7; }
.chip.date.late{ background:var(--t4b); color:var(--t4f); }
.chip.person{ background:transparent; color:var(--link); padding:0 2px; }
.chip.tabref{ background:transparent; color:var(--link); padding:0 2px; text-decoration:underline dotted; text-underline-offset:3px; }
.chip.tabref.broken{ color:var(--faint); text-decoration:line-through; }
.chip.dd{ font-weight:500; }
.chip.dd[data-tone="0"]{ background:var(--t0b); color:var(--t0f); } .chip.dd[data-tone="1"]{ background:var(--t1b); color:var(--t1f); }
.chip.dd[data-tone="2"]{ background:var(--t2b); color:var(--t2f); } .chip.dd[data-tone="3"]{ background:var(--t3b); color:var(--t3f); }
.chip.dd[data-tone="4"]{ background:var(--t4b); color:var(--t4f); } .chip.dd[data-tone="5"]{ background:var(--t5b); color:var(--t5f); }
.chip.dd.unset{ background:transparent; color:var(--faint); box-shadow:inset 0 0 0 1px var(--line); font-weight:400; }

/* Comment highlights */
mark.cmt{ background:var(--hl); color:inherit; border-bottom:2px solid var(--hl-line); cursor:pointer; }
mark.cmt.active{ background:var(--hl-strong); }
mark.cmt.resolved{ background:none; border-bottom:0; cursor:text; }

/* Tables */
.tbl-wrap{ overflow-x:auto; margin:18px 0; }
table.dt{ border-collapse:collapse; width:100%; font-size:.93rem; }
table.dt th, table.dt td{ border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; min-width:84px; }
table.dt th{ background:var(--panel); font-weight:500; }
.tbl-tools{ position:absolute; z-index:15; display:flex; flex-wrap:wrap; gap:2px; background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:3px; box-shadow:0 2px 8px rgba(0,0,0,.08); font-size:.8rem; }
.tbl-tools button{ border:0; background:none; padding:3px 8px; border-radius:4px; cursor:pointer; font-weight:500; }
.tbl-tools button:hover{ background:var(--panel); }

/* Blocks (code, diagrams, math, csv, charts, images) */
figure.blk{ margin:24px 0; position:relative; }
.blk-bar{ position:absolute; right:0; bottom:100%; margin-bottom:4px; display:none; flex-wrap:wrap; gap:4px; align-items:center; justify-content:flex-end; background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font-size:.78rem; z-index:5; max-width:100%; box-shadow:0 2px 8px rgba(0,0,0,.08); }
figure.blk:hover .blk-bar, figure.blk:focus-within .blk-bar, figure.blk.sel .blk-bar{ display:flex; }
.blk-bar select{ border:1px solid var(--line); background:var(--paper); border-radius:4px; font-size:.78rem; padding:1px 4px; }
.blk-bar button{ border:0; background:none; cursor:pointer; padding:2px 7px; border-radius:4px; font-weight:500; }
.blk-bar button:hover{ background:var(--panel); }
.blk-bar label{ display:inline-flex; align-items:center; gap:4px; color:var(--ink-soft); }
.blk-bar .grow{ flex:1; }
figure.code textarea.src{ display:block; width:100%; border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:12px 14px; font:13.5px/1.55 var(--mono); resize:vertical; tab-size:2; color:var(--ink); }
figure.code.renders:not(.editing):not(.empty) textarea.src{ display:none; }
figure.code.renders.editing .preview{ margin-top:10px; }
figure.code .preview:empty{ display:none; }
figure.code .preview{ overflow-x:auto; }
figure.code[data-lang="mermaid"] .preview, figure.code[data-lang="latex"] .preview{ text-align:center; padding:8px 0; }
figure.code .preview .err{ color:var(--t4f); font-size:.85rem; text-align:left; font-family:var(--mono); white-space:pre-wrap; }
table.csv-grid{ border-collapse:collapse; font:13px/1.5 var(--mono); }
table.csv-grid td{ border:1px solid var(--line); padding:3px 9px; }
table.csv-grid tr:first-child td{ background:var(--panel); font-weight:500; }
figure.chart .c-title{ font-weight:500; font-size:1.05rem; margin-bottom:6px; outline:none; }
figure.chart svg{ display:block; width:100%; height:auto; }
figure figcaption{ color:var(--ink-soft); font-size:.84rem; margin-top:6px; outline:none; }
#editor.is-empty > p:first-child{ position:relative; }
#editor.is-empty > p:first-child::before{ content:'Start writing, or type / for headings, tables, charts and more'; position:absolute; left:0; top:0; color:var(--faint); pointer-events:none; white-space:nowrap; overflow:hidden; max-width:100%; text-overflow:ellipsis; }
body.viewing #editor.is-empty > p:first-child::before{ content:none; }
[data-ph]:empty::before{ content:attr(data-ph); color:var(--faint); }
figure.img{ text-align:center; }
figure.img img{ display:inline-block; border-radius:4px; }
figure.img[data-size="s"] img{ max-width:40%; } figure.img[data-size="m"] img{ max-width:72%; } figure.img[data-size="l"] img{ max-width:100%; }

/* Status line */
.status{ display:flex; flex-wrap:wrap; gap:18px; color:var(--faint); font-size:.8rem; border-top:1px solid var(--line); padding-top:10px; }

/* ---------- Comments rail ---------- */
.rail{ position:sticky; top:0; align-self:start; padding-top:48px; max-height:100vh; overflow:auto; font-size:.88rem; padding-bottom:24px; }
.rail-head{ display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--faint); padding-bottom:8px; margin-bottom:14px; }
.rail-head h2{ font-size:1.1rem; font-weight:500; margin:0; flex:1; }
.rail-head button{ border:0; background:none; cursor:pointer; color:var(--ink-soft); padding:2px 6px; border-radius:4px; font-size:.82rem; }
.rail-head button:hover, .rail-head button.on{ background:var(--panel); color:var(--ink); }
.rail-empty{ color:var(--faint); }
.thread{ border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; cursor:pointer; background:var(--paper); }
.thread.active{ border-color:var(--ink-soft); box-shadow:0 2px 10px rgba(0,0,0,.08); cursor:default; }
.thread.resolved{ opacity:.75; }
.thread .q{ border-left:3px solid var(--hl-line); padding-left:8px; color:var(--ink-soft); margin-bottom:8px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.thread .orphan{ color:var(--faint); font-size:.8rem; margin:-4px 0 8px; }
.msg{ margin-bottom:8px; }
.msg .who{ display:flex; gap:8px; align-items:baseline; }
.msg .who b{ font-weight:500; }
.msg time{ color:var(--faint); font-size:.76rem; }
.msg .body{ white-space:normal; overflow-wrap:anywhere; }
.reply textarea{ width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:var(--paper); resize:vertical; }
.racts, .tacts{ display:flex; gap:6px; justify-content:flex-end; margin-top:6px; }
.racts button, .tacts button{ border:0; background:none; cursor:pointer; padding:3px 9px; border-radius:4px; font-weight:500; font-size:.82rem; color:var(--ink-soft); }
.racts button:hover, .tacts button:hover{ background:var(--panel); color:var(--ink); }
button.primary{ background:var(--ink) !important; color:var(--paper) !important; }

/* ---------- Menus, dialogs, toast ---------- */
.menu{ position:fixed; z-index:200; min-width:230px; max-width:320px; max-height:min(380px,70vh); overflow:auto; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:4px; box-shadow:0 8px 28px rgba(0,0,0,.16); font-size:.9rem; }
.menu .mi{ display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:6px 10px; border-radius:5px; text-align:left; cursor:pointer; }
.menu .mi span{ flex:1; }
.menu .mi.on{ background:var(--panel); }
.menu .mi[disabled]{ color:var(--faint); cursor:default; }
.menu .mi .ck{ width:14px; color:var(--accent); flex:none; }
.menu kbd{ font:inherit; font-size:.76rem; color:var(--faint); }
.menu .mhead{ font-size:.75rem; color:var(--faint); padding:8px 10px 2px; }
.menu .sep{ height:1px; background:var(--line); margin:4px 6px; }
.menu .mcustom{ padding:6px 10px; }
.menu .mcustom input{ width:100%; border:1px solid var(--line); border-radius:4px; padding:4px 6px; background:var(--paper); }

dialog{ border:1px solid var(--line); border-radius:10px; padding:0; background:var(--paper); color:var(--ink); width:min(560px,92vw); max-height:86vh; }
dialog::backdrop{ background:rgba(0,0,0,.35); }
.dlg{ padding:20px 22px; }
.dlg h2{ font-size:1.2rem; font-weight:500; margin:0 0 14px; }
.dlg label{ display:block; font-size:.86rem; color:var(--ink-soft); margin-bottom:12px; }
.dlg label.row{ display:flex; gap:8px; align-items:center; color:var(--ink); }
.dlg input:not([type=checkbox]):not([type=radio]), .dlg textarea{ display:block; width:100%; margin-top:4px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:var(--paper); color:var(--ink); }
.dlg textarea{ font-family:var(--mono); font-size:.84rem; }
.dlg .note{ color:var(--ink-soft); font-size:.86rem; margin:0 0 12px; }
.dlg-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.dlg-actions button, .dlg .btn{ border:1px solid var(--line); background:var(--paper); border-radius:6px; padding:6px 14px; cursor:pointer; font-weight:500; }
.seg{ display:flex; gap:16px; border:0; padding:0; margin:0 0 14px; }
.fmt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.fmt-grid button{ text-align:left; border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:10px 12px; cursor:pointer; }
.fmt-grid button:hover{ border-color:var(--ink-soft); }
.fmt-grid b{ display:block; font-weight:500; }
.fmt-grid span{ color:var(--ink-soft); font-size:.8rem; }
.ver{ display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--line); padding:8px 0; font-size:.88rem; }
.ver div{ flex:1; min-width:0; }
.ver small{ color:var(--faint); display:block; }
.keys{ display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:.88rem; }
.keys kbd{ font-family:var(--mono); font-size:.8rem; background:var(--panel); padding:1px 6px; border-radius:4px; }
.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:8px 16px; border-radius:6px; font-size:.88rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:300; max-width:90vw; }
.toast.show{ opacity:1; transform:translateX(-50%); }

/* View-only mode */
body.viewing .toolbar .edit-only, body.viewing .blk-bar, body.viewing .tbl-tools{ display:none !important; }
body.viewing li.task::before{ cursor:default; }

#print-area{ display:none; }

/* ---------- Responsive ---------- */
@media (max-width: 1240px){
  .page-wrap, .page-wrap.no-rail{ grid-template-columns:230px minmax(0,1fr); }
  .rail{ position:fixed; right:0; top:0; bottom:0; width:min(340px,92vw); max-height:none; background:var(--paper); border-left:1px solid var(--line); padding:20px 16px; z-index:90; transform:translateX(105%); transition:transform .2s; box-shadow:-8px 0 24px rgba(0,0,0,.1); }
  .page-wrap.rail-open .rail{ transform:none; display:block; }
  .page-wrap.no-rail .rail{ display:block; }
}
@media (max-width: 960px){
  .page-wrap, .page-wrap.no-rail{ grid-template-columns:minmax(0,1fr); gap:0; }
  .browse{ display:none; }
  article{ padding-top:20px; }
  .mobile-tabs{ display:flex; gap:6px; overflow-x:auto; padding:0 64px 12px 0; margin-bottom:12px; border-bottom:1px solid var(--line); }
  .mobile-tabs button{ border:1px solid var(--line); background:var(--paper); border-radius:16px; padding:3px 12px; white-space:nowrap; font-size:.85rem; cursor:pointer; }
  .mobile-tabs button.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .toolbar{ position:fixed; top:16px; right:16px; margin:0; display:flex; flex-direction:column; align-items:flex-end; z-index:100; }
  .toolbar-toggle{ display:flex; width:44px; height:44px; border-radius:50%; background:var(--ink); color:var(--paper); border:none; font-size:1.2rem; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.2); justify-content:center; align-items:center; padding:0; }
  .toolbar.expanded .toolbar-toggle{ background:var(--faint); }
  .toolbar-content{ display:none; flex-direction:column; padding:12px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.2); gap:10px; margin-top:8px; width:max-content; max-width:calc(100vw - 32px); max-height:75vh; overflow:auto; }
  .toolbar.expanded .toolbar-content{ display:flex; }
  .toolbar-content .group{ border-right:none; border-bottom:1px solid var(--line); padding-right:0; padding-bottom:8px; flex-wrap:wrap; justify-content:center; width:100%; }
  .toolbar-content .group:last-child{ border-bottom:none; padding-bottom:0; margin-left:0 !important; }
  .findbar{ top:0; margin-top:0; }
  .fmt-grid{ grid-template-columns:1fr; }
}

/* ---------- Print / PDF ---------- */
@media print{
  body > *:not(#print-area){ display:none !important; }
  #print-area{ display:block; font:400 11pt/1.55 var(--font); color:#000; }
  #print-area h1{ font-weight:500; font-size:22pt; line-height:1.15; margin:0 0 10pt; }
  #print-area h2{ font-weight:500; font-size:15pt; margin:18pt 0 6pt; }
  #print-area h3{ font-weight:500; font-size:12.5pt; margin:14pt 0 4pt; }
  #print-area .x-break, #print-area hr.page-break{ break-after:page; border:0; margin:0; }
  #print-area figure, #print-area table, #print-area pre{ break-inside:avoid; }
  #print-area table{ border-collapse:collapse; width:100%; }
  #print-area th, #print-area td{ border:1px solid #bbb; padding:4pt 7pt; text-align:left; }
  #print-area pre{ background:#f4f4f4; padding:8pt; white-space:pre-wrap; font:9.5pt/1.5 var(--mono); }
  #print-area a{ color:#0B57D0; }
}

<body>

    <div class="findbar" id="findbar" hidden>

<div id="print-area"></div>
<div class="menu" id="menu" hidden></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   Utilities
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const editor = $('#editor'), article = $('#article'), wrap = $('#wrap');
const LS = { doc: 'puretext.doc.v2', ver: 'puretext.versions.v2', theme: 'puretext.theme', rail: 'puretext.rail' };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isoOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayISO = () => isoOf(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); };
const fmtDate = iso => { if (!iso) return 'Pick a date'; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };
const ago = t => { const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
const safeName = s => (s || 'Untitled document').replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'Untitled document';
const safeURL = u => { u = String(u || '').trim(); return /^(javascript|vbscript|data:text\/html)/i.test(u) ? '' : u; };
const own = sel => $$(sel, editor).filter(e => !e.parentElement.closest('.preview'));
function unwrap(el) { const p = el.parentNode; if (!p) return; while (el.firstChild) p.insertBefore(el.firstChild, el); p.removeChild(el); p.normalize(); }
function htmlToNodes(html) { const t = document.createElement('template'); t.innerHTML = html; return [...t.content.childNodes]; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function download(name, content, type) {

  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
const loadedScripts = {};
function loadScript(src) {
  return loadedScripts[src] || (loadedScripts[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => { delete loadedScripts[src]; rej(new Error('Could not load ' + src.split('/').slice(-1)[0] + ' — check the connection.')); };
    document.head.appendChild(s);
  }));
}
function loadCSS(href) { if (!$(`link[href="${href}"]`)) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l); } }
const CDN = {
  mermaid: 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
  katex: 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js',
  katexCSS: 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css'
};

/* =========================================================
   Document model
   ========================================================= */
let doc = null;
let viewMode = false;
const defaultEnums = () => ({
  status: { name: 'Status', options: ['Not started', 'In progress', 'In review', 'Done', 'Blocked'] },
  priority: { name: 'Priority', options: ['Low', 'Medium', 'High', 'Urgent'] }
});

const chip = {
  date: iso => `<span class="chip date" contenteditable="false" data-date="${esc(iso || '')}">${esc(fmtDate(iso))}</span>`,
  person: n => `<span class="chip person" contenteditable="false" data-name="${esc(n)}">@${esc(n)}</span>`,
  tab: id => `<span class="chip tabref" contenteditable="false" data-tab="${esc(id)}">${esc(tabName(id))}</span>`,
  dd: (en, i) => {
    const e = doc && doc.enums[en]; const has = i !== '' && i != null && e && e.options[i] != null;
    return `<span class="chip dd${has ? '' : ' unset'}" contenteditable="false" data-enum="${esc(en)}" data-i="${has ? i : ''}" data-tone="${has ? i % 6 : ''}">${esc(has ? e.options[i] : (e ? e.name : 'Select'))}</span>`;
  }
};

function starterHTML() { return '<p><br></p>'; }
function newDoc(first) {
  const author = (doc && doc.author) || 'Me';
  const id = uid('t');
  const d = { v: 2, title: 'Untitled document', author, people: [author], enums: defaultEnums(), comments: {},
    tabs: [{ id, name: 'Main', parent: null, html: '' }], activeTab: id, updated: Date.now() };
  d.tabs[0].html = starterHTML(d, first);
  return d;
}
function validate(d) {
  if (!d || !Array.isArray(d.tabs) || !d.tabs.length) return null;
  d.v = 2; d.title = d.title || 'Untitled document'; d.author = d.author || 'Me';
  d.people = Array.isArray(d.people) && d.people.length ? d.people : [d.author];
  if (!d.people.includes(d.author)) d.people.unshift(d.author);
  d.enums = d.enums && typeof d.enums === 'object' ? d.enums : defaultEnums();
  d.comments = d.comments && typeof d.comments === 'object' ? d.comments : {};
  const ids = new Set(d.tabs.map(t => t.id));
  d.tabs.forEach(t => { t.name = t.name || 'Untitled tab'; t.html = t.html || '<p><br></p>'; if (t.parent && !ids.has(t.parent)) t.parent = null; if (t.parent === t.id) t.parent = null; });
  if (!ids.has(d.activeTab)) d.activeTab = d.tabs[0].id;
  return d;
}
const findTab = id => doc.tabs.find(t => t.id === id);
const activeTab = () => findTab(doc.activeTab);
const tabName = id => { const t = doc && findTab(id); return t ? t.name : 'Deleted tab'; };
function orderedTabs() {
  const out = [];
  const walk = (pid, depth) => doc.tabs.filter(t => (t.parent || null) === pid).forEach(t => { out.push({ t, depth }); walk(t.id, depth + 1); });
  walk(null, 0); return out;
}
const descendants = id => { const out = []; const w = p => doc.tabs.filter(t => t.parent === p).forEach(t => { out.push(t.id); w(t.id); }); w(id); return out; };

/* ---------- Save / load ---------- */
function serialize() {
  const c = editor.cloneNode(true);
  $$('mark.cmt.active', c).forEach(m => m.classList.remove('active'));
  $$('figure.blk', c).forEach(f => f.classList.remove('sel', 'editing'));
  $$('figure.blk > .blk-bar', c).forEach(b => b.innerHTML = '');
  return c.innerHTML;
}
function syncActive() { const t = activeTab(); if (t && editor.dataset.tab === t.id) t.html = serialize(); }
let saveT, statsT, chartT;
function setStatus(s) { $('#st-save').textContent = s; }
function updateEmpty() {
  const k = editor.children, p0 = k[0];
  editor.classList.toggle('is-empty', k.length === 1 && p0.tagName === 'P' && !p0.textContent.trim() && !p0.querySelector('img, .chip'));
}
function markDirty() {
  updateEmpty();
  setStatus('Editing…');
  clearTimeout(saveT); saveT = setTimeout(save, 700);
  clearTimeout(statsT); statsT = setTimeout(() => { updateOutline(); updateStats(); }, 400);
}
function save() {
  if (!doc) return;
  syncActive(); doc.updated = Date.now();
  const ok = store.set(LS.doc, JSON.stringify(doc));
  setStatus(ok ? 'Saved in this browser ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Not saved: browser storage is full or blocked. Export a copy from File.');
  maybeAutoSnapshot();
}

/* ---------- Version history ---------- */
function versions() { try { return JSON.parse(store.get(LS.ver) || '[]'); } catch (e) { return []; } }
function snapshot(label) {
  if (!doc) return; syncActive();
  const v = versions();
  v.unshift({ at: Date.now(), label: label || 'Autosave', title: doc.title, data: JSON.stringify(doc) });
  while (v.length > 30) v.pop();
  while (!store.set(LS.ver, JSON.stringify(v)) && v.length > 1) v.pop();
}
function maybeAutoSnapshot() { const v = versions(); if (!v.length || Date.now() - v[0].at > 10 * 60e3) snapshot('Autosave'); }

/* =========================================================
   Rendering
   ========================================================= */
function renderAll() {
  $('#file-name').textContent = doc.title;
  document.title = doc.title + ' · PureText';
  renderTab();
}
function renderTab() {
  const t = activeTab();
  closeMenu(); closeFind(true);
  editor.dataset.tab = t.id;
  editor.innerHTML = t.html || '<p><br></p>';
  updateEmpty();
  normalize(); hydrate();
  renderTabs(); updateOutline(); renderComments(); updateStats();
  $('#tbl-tools').hidden = true;
}
function hydrate(root = editor) {
  $$('.chip.tabref', root).forEach(c => { const t = findTab(c.dataset.tab); c.textContent = t ? t.name : 'Deleted tab'; c.classList.toggle('broken', !t); });
  $$('.chip.dd', root).forEach(refreshDD);
  $$('.chip.date', root).forEach(refreshDate);
  $$('figure.code', root).filter(f => !f.parentElement.closest('.preview')).forEach(setupCode);
  $$('figure.img', root).forEach(setupImg);
  $$('figure.chart', root).forEach(f => { f._sig = null; renderChart(f); });
  $$('.c-title, figure figcaption', root).forEach(e => e.setAttribute('contenteditable', viewMode ? 'false' : 'true'));
  syncMarks();
}
function refreshDD(c) {
  const e = doc.enums[c.dataset.enum]; const i = c.dataset.i;
  const has = e && i !== '' && e.options[+i] != null;
  c.textContent = has ? e.options[+i] : (e ? e.name : 'Select');
  c.classList.toggle('unset', !has); c.dataset.tone = has ? (+i % 6) : '';
  if (!has) c.dataset.i = '';
}
function refreshDate(c) {
  c.textContent = fmtDate(c.dataset.date);
  const li = c.closest('li.task');
  c.classList.toggle('late', !!(c.dataset.date && c.dataset.date < todayISO() && li && li.dataset.done !== '1'));
}
function normalize(root = editor) {
  const seen = new Set();
  $$('table', root).forEach(t => {
    if (t.closest('.preview') || t.classList.contains('csv-grid')) return;
    t.classList.add('dt');
    if (!t.id || seen.has(t.id)) t.id = uid('tbl');
    seen.add(t.id);
    if (!t.parentElement.classList.contains('tbl-wrap')) { const w = document.createElement('div'); w.className = 'tbl-wrap'; t.before(w); w.appendChild(t); }
    const r0 = t.rows[0];
    if (r0) [...r0.cells].forEach(c => { if (c.tagName === 'TD') { const th = document.createElement('th'); th.innerHTML = c.innerHTML; c.replaceWith(th); } });
  });
  [...root.childNodes].forEach(n => { if (n.nodeType === 3 && n.nodeValue.trim()) { const p = document.createElement('p'); n.before(p); p.appendChild(n); } });
  const last = root.lastElementChild;
  if (!last || last.matches('figure, .tbl-wrap, hr, ul, ol, blockquote, h1, h2, h3')) root.insertAdjacentHTML('beforeend', '<p><br></p>');
}

/* ---------- Tabs ---------- */
function renderTabs() {
  const list = $('#tab-list'); list.innerHTML = '';
  orderedTabs().forEach(({ t, depth }) => {
    const li = document.createElement('li');
    li.className = 'tab-item' + (t.id === doc.activeTab ? ' active' : '');
    li.style.setProperty('--d', depth); li.draggable = true; li.dataset.tab = t.id;
    li.innerHTML = `<button class="tab-btn" data-tab="${t.id}" title="${esc(t.name)}">${esc(t.name)}</button><button class="tab-more" data-tabmenu="${t.id}" aria-label="Options for ${esc(t.name)}">&#8943;</button>`;
    list.appendChild(li);
  });
  const mt = $('#mobile-tabs');
  mt.innerHTML = orderedTabs().map(({ t, depth }) => `<button data-tab="${t.id}" class="${t.id === doc.activeTab ? 'active' : ''}">${depth ? '› ' : ''}${esc(t.name)}</button>`).join('') + `<button data-addtab="1" aria-label="Add tab">+</button>`;
  $('#st-tab').textContent = doc.tabs.length > 1 ? `Tab: ${activeTab().name}` : '';
}
function switchTab(id) {
  if (!findTab(id)) return;
  if (id === doc.activeTab) return;
  syncActive(); doc.activeTab = id; activeThread = null; draftId = null;
  renderTab(); save(); window.scrollTo({ top: 0 });
}
function insertTabAfter(t, ref) {
  if (!ref) { doc.tabs.push(t); return; }
  const last = [ref.id, ...descendants(ref.id)].map(id => doc.tabs.findIndex(x => x.id === id)).reduce((a, b) => Math.max(a, b), -1);

  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function splitRow(line) { return line.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|')); }
function mdList(lines) {
  const root = { children: [] }; const stack = [{ indent: -1, node: root }];
  lines.forEach(ln => {
    const m = ln.match(/^(\s*)([-*+]|\d+[.)])\s+(\[([ xX])\]\s+)?(.*)$/);
    if (!m) { const top = stack[stack.length - 1].node; if (top.text != null) top.text += ' ' + ln.trim(); return; }
    const ind = m[1].replace(/\t/g, '    ').length;
    while (stack.length > 1 && ind <= stack[stack.length - 1].indent) stack.pop();
    const item = { text: m[5], type: /\d/.test(m[2]) ? 'ol' : 'ul', task: m[3] != null, done: m[4] && m[4] !== ' ', children: [] };
    stack[stack.length - 1].node.children.push(item); stack.push({ indent: ind, node: item });
  });
  const rl = items => { let out = '', i = 0; while (i < items.length) { const t = items[i].type, tk = items[i].task; const grp = []; while (i < items.length && items[i].type === t && items[i].task === tk) grp.push(items[i++]); out += `<${t}${tk ? ' class="tasks"' : ''}>` + grp.map(it => `<li${tk ? ` class="task" data-done="${it.done ? 1 : 0}"` : ''}>${mdInline(it.text)}${it.children.length ? rl(it.children) : ''}</li>`).join('') + `</${t}>`; } return out; };
  return rl(root.children);

function mdToHTML(md) {
  const L = md.replace(/\r\n?/g, '\n').split('\n'); const out = []; let i = 0, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.map(mdInline).join('<br>')}</p>`); para = []; } };
  const isList = l => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  while (i < L.length) {
    const line = L[i]; let m;
    if ((m = line.match(/^\s*```\s*([\w-]*)\s*$/))) { flush(); const buf = []; i++; while (i < L.length && !/^\s*```\s*$/.test(L[i])) buf.push(L[i++]); i++; out.push(codeHTML(normLang(m[1]), buf.join('\n'))); continue; }
    if (/^\s*\$\$\s*$/.test(line)) { flush(); const buf = []; i++; while (i < L.length && !/^\s*\$\$\s*$/.test(L[i])) buf.push(L[i++]); i++; out.push(codeHTML('latex', buf.join('\n'))); continue; }
    if (!line.trim()) { flush(); i++; continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flush(); const n = Math.min(3, m[1].length); out.push(`<h${n}>${mdInline(m[2].replace(/\s+#+\s*$/, ''))}</h${n}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push('<hr>'); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      flush(); const head = splitRow(line); i += 2; const rows = [];
      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(splitRow(L[i++]));
      out.push(tableHTML(head.map(mdInline), rows.map(r => head.map((_, k) => mdInline(r[k] || ''))))); continue;
    }
    if (/^\s*>/.test(line)) { flush(); const buf = []; while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, '')); out.push(`<blockquote>${buf.map(mdInline).join('<br>')}</blockquote>`); continue; }
    if ((m = line.match(/^\s*!\[([^\]]*)\]\(([^)\s]+)\)\s*$/)) && safeURL(m[2])) { flush(); out.push(imgHTML(m[2], m[1])); i++; continue; }
    if (isList(line)) { flush(); const buf = []; while (i < L.length && (isList(L[i]) || (/^\s{2,}\S/.test(L[i]) && buf.length))) buf.push(L[i++]); out.push(mdList(buf)); continue; }

function toMD(html) {
  const root = document.createElement('div'); root.innerHTML = html; const out = [];
  const wrapMd = (w, s) => { const m = s.match(/^(\s*)([\s\S]*?)(\s*)$/); return m[2] ? m[1] + w + m[2] + w + m[3] : s; };
  const inl = c => {
    if (c.nodeType === 3) return c.nodeValue.replace(/\u00a0/g, ' ').replace(/([*_`~\[\]])/g, '\\$1');
    if (c.nodeType !== 1) return '';
    if (c.classList.contains('chip')) return c.classList.contains('date') ? (c.dataset.date || '') : c.classList.contains('unset') ? '' : c.textContent;
    const inner = () => [...c.childNodes].map(inl).join('');
    switch (c.tagName) {
      case 'B': case 'STRONG': return wrapMd('**', inner());
      case 'I': case 'EM': return wrapMd('*', inner());
      case 'S': case 'DEL': case 'STRIKE': return wrapMd('~~', inner());
      case 'CODE': return '`' + c.textContent + '`';
      case 'A': return `[${inner()}](${c.getAttribute('href') || ''})`;
      case 'BR': return '  \n';
      case 'IMG': return `![${c.getAttribute('alt') || ''}](${c.getAttribute('src')})`;
      default: return inner();
    }
  };
  const inline = el => [...el.childNodes].map(inl).join('').trim();
  const list = (el, depth) => {
    const lines = []; let n = 1;
    [...el.children].forEach(li => {
      if (li.tagName === 'UL' || li.tagName === 'OL') { lines.push(list(li, depth + 1)); return; }
      if (li.tagName !== 'LI') return;
      const task = li.classList.contains('task');
      const mk = el.tagName === 'OL' ? (n++) + '.' : '-';
      const txt = [...li.childNodes].filter(c => !(c.nodeType === 1 && /^(UL|OL)$/.test(c.tagName))).map(inl).join('').trim();
      lines.push('  '.repeat(depth) + mk + ' ' + (task ? (li.dataset.done === '1' ? '[x] ' : '[ ] ') : '') + txt);
      $$(':scope > ul, :scope > ol', li).forEach(s => lines.push(list(s, depth + 1)));
    });
    return lines.join('\n');
  };
  const block = el => {
    [...el.childNodes].forEach(c => {
      if (c.nodeType === 3) { if (c.nodeValue.trim()) out.push(inl(c).trim()); return; }
      if (c.nodeType !== 1) return;
      const t = c.tagName;
      if (/^H[1-3]$/.test(t)) out.push('#'.repeat(+t[1]) + ' ' + inline(c));
      else if (t === 'BLOCKQUOTE') out.push(inline(c).split('\n').map(l => '> ' + l).join('\n'));
      else if (t === 'UL' || t === 'OL') out.push(list(c, 0));
      else if (t === 'HR') out.push(c.classList.contains('page-break') ? '<div style="page-break-after: always"></div>' : '---');
      else if (t === 'TABLE') {
        const rows = [...c.rows].map(r => [...r.cells].map(x => inline(x).replace(/\|/g, '\\|').replace(/\n/g, ' ')));
        if (rows.length) out.push(['| ' + rows[0].join(' | ') + ' |', '| ' + rows[0].map(() => '---').join(' | ') + ' |', ...rows.slice(1).map(r => '| ' + r.join(' | ') + ' |')].join('\n'));
      }
      else if (t === 'FIGURE') {
        if (c.classList.contains('code')) { const lang = c.dataset.lang; const src = (c.querySelector('textarea') || {}).textContent || ''; out.push('```' + (lang === 'plain' ? '' : lang === 'latex' ? 'math' : lang) + '\n' + src + '\n```'); }
        else if (c.classList.contains('chart')) { const ti = (c.querySelector('.c-title') || {}).textContent || ''; out.push(`*Chart${ti.trim() ? ': ' + ti.trim() : ''} (drawn from the table above)*`); }
        else if (c.classList.contains('img')) { const img = c.querySelector('img'); const cap = (c.querySelector('figcaption') || {}).textContent || ''; if (img) out.push(`![${cap.trim()}](${img.getAttribute('src')})`); }
      }
      else if (c.querySelector && c.querySelector('p, h1, h2, h3, ul, ol, table, figure, blockquote, hr')) block(c);
      else { const s = inline(c); if (s) out.push(s); }
    });
  };
  block(root);
  return out.join('\n\n');
}

/* =========================================================
   Toolbar, file menu, theme, view mode, shortcuts
   ========================================================= */
$('#toolbar-toggle').addEventListener('click', () => $('#toolbar').classList.toggle('expanded'));
$('.toolbar-content').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
const CMD = {
  undo: () => { exec('undo'); hydrate(); }, redo: () => { exec('redo'); hydrate(); },
  bold: () => exec('bold'), italic: () => exec('italic'), underline: () => exec('underline'), strike: () => exec('strikeThrough'),
  code: toggleCode, link: insertLink, ul: () => exec('insertUnorderedList'), ol: () => exec('insertOrderedList'), tasks: toggleTasks,
  align: b => openMenu([{ label: 'Align left', run: () => exec('justifyLeft') }, { label: 'Center', run: () => exec('justifyCenter') }, { label: 'Align right', run: () => exec('justifyRight') }, { label: 'Justify', run: () => exec('justifyFull') }], rectPos(b)),
  insert: b => openMenu(blockItems(), rectPos(b)),
  comment: addComment, rail: toggleRail, find: openFind,
  file: b => openMenu(fileItems(), rectPos(b)), theme: cycleTheme
};
$('.toolbar-content').addEventListener('click', e => { const b = e.target.closest('[data-cmd]'); if (b && CMD[b.dataset.cmd]) CMD[b.dataset.cmd](b); });
$('#blocksel').addEventListener('change', e => fmtBlock(e.target.value));

function fileItems() {
  return [
    { label: 'New document', run: () => { if (!confirm('Start a new document? The current one is kept in version history.')) return; snapshot('Before new document'); doc = newDoc(false); editor.dataset.tab = ''; renderAll(); save(); placeCaretEnd(editor.querySelector('p') || editor); } },
    { label: 'Open…', hint: '.json .md .txt .html', run: () => $('#file-input').click() },
    { sep: true },
    { label: 'Share link…', run: openShare },
    { label: 'Export…', run: openExport },
    { label: 'Print or save as PDF', hint: 'this tab', run: () => printDoc(false) },
    { sep: true },
    { label: 'Save a version', run: () => { snapshot('Saved version'); toast('Version saved'); } },
    { label: 'Version history…', run: openHistory },
    { sep: true },
    { label: viewMode ? 'Switch to editing' : 'Switch to viewing', run: () => setViewMode(!viewMode) },
    { label: 'Your name…', hint: doc.author, run: async () => { const r = await ask({ title: 'Your name', note: 'Used on comments you write and as the author chip.', fields: [{ name: 'n', label: 'Name', value: doc.author }], ok: 'Save' }); if (r && r.n.trim()) { const old = doc.author; doc.author = r.n.trim(); doc.people = doc.people.map(p => p === old ? doc.author : p); if (!doc.people.includes(doc.author)) doc.people.unshift(doc.author); markDirty(); } } },
    { label: 'Keyboard shortcuts', run: showKeys }
  ];
}
function showKeys() {
  panel('Keyboard shortcuts', `<div class="keys">
    <kbd>/</kbd><span>Insert menu: headings, lists, tables, charts, diagrams, math, images</span>
    <kbd>@</kbd><span>Dates, people and links to tabs</span>
    <kbd># ## ###</kbd><span>then Space: title, heading, subheading</span>
    <kbd>- 1. [] &gt;</kbd><span>then Space: bullet, numbered, task list, quote</span>
    <kbd>\`\`\`</kbd><span>then Enter: code block (add a language, e.g. \`\`\`mermaid)</span>
    <kbd>---</kbd><span>then Enter: divider</span>
    <kbd>Ctrl B / I / U</kbd><span>Bold, italic, underline</span>
    <kbd>Ctrl K</kbd><span>Link</span><kbd>Ctrl E</kbd><span>Inline code</span>
    <kbd>Ctrl Alt M</kbd><span>Comment on selection</span>
    <kbd>Ctrl F</kbd><span>Find and replace</span><kbd>Ctrl S</kbd><span>Save now</span>
    <kbd>Tab</kbd><span>Next table cell (adds a row at the end), or indent a list item</span>
  </div>`);
}
const THEME_IC = {
  auto: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>',
  light: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  dark: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>'
};
function applyTheme(t) {
  const root = document.documentElement; if (t === 'auto') delete root.dataset.theme; else root.dataset.theme = t;
  const tb = $('#theme-btn'); tb.innerHTML = THEME_IC[t]; tb.title = 'Colour theme: ' + { auto: 'Auto', light: 'Light', dark: 'Dark' }[t]; store.set(LS.theme, t);
}
function cycleTheme() {
  const cur = store.get(LS.theme) || 'auto'; const next = { auto: 'light', light: 'dark', dark: 'auto' }[cur];
  applyTheme(next); own('figure.code[data-lang="mermaid"]').forEach(renderPreview);
}
function setViewMode(on) {
  viewMode = on; editor.contentEditable = on ? 'false' : 'true'; document.body.classList.toggle('viewing', on);
  $$('.c-title, figure figcaption', editor).forEach(e => e.setAttribute('contenteditable', on ? 'false' : 'true'));
  $$('textarea.src', editor).forEach(t => t.readOnly = on); $('#tbl-tools').hidden = true;

document.addEventListener('keydown', e => {
  if (menuState.open && !e.target.closest('.menu')) {
    if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); menuMove(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); menuMove(-1); return; }
    if (e.key === 'Enter' || (e.key === 'Tab' && menuState.trigger)) { if (menuState.active >= 0) { e.preventDefault(); e.stopPropagation(); runMenuItem(menuState.active); return; } }
    if (e.key === 'Escape') { e.preventDefault(); closeMenu(); return; }
  }
  if (menuState.open && e.key === 'Escape') { closeMenu(); return; }
  const mod = e.metaKey || e.ctrlKey;
  if (mod && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 's') { e.preventDefault(); save(); toast('Saved'); }
  if (mod && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'f' && !dlg.open) { e.preventDefault(); openFind(); }

window.addEventListener('beforeunload', () => { if (doc) { syncActive(); store.set(LS.doc, JSON.stringify(doc)); } });
window.addEventListener('resize', () => { if (!$('#tbl-tools').hidden) updateTblTools(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => own('figure.code[data-lang="mermaid"]').forEach(renderPreview));

/* =========================================================
   Start
   ========================================================= */
(async function init() {
  applyTheme(store.get(LS.theme) || 'auto');
  if (store.get(LS.rail) === '0') wrap.classList.add('no-rail');
  let local = null; const raw = store.get(LS.doc);
  if (raw) { try { local = validate(JSON.parse(raw)); } catch (e) {} }
  doc = local || newDoc(true);
  const h = location.hash.match(/[#&]doc=([^&]+)/); const view = /[#&]view=1/.test(location.hash);
  if (h) {
    try {
      const shared = validate(await unpack(h[1]));
      if (shared && (!local || confirm(`Open the shared document "${shared.title}"? Your current document stays in version history.`))) {
        if (local) { editor.dataset.tab = ''; snapshot('Before opening a shared link'); }
        doc = shared;
      }
    } catch (e) { toast('That share link is damaged or incomplete.'); }
    history.replaceState(null, '', location.pathname + location.search);
  }
  renderAll();
  if (view) setViewMode(true);
  save();
})();
