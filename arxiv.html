<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<meta name="description" content="A reader for the arXiv preprint server.">
<title>arXiv Explorer</title>
<meta property="og:title" content="arXiv Explorer">
<meta property="og:description" content="A reader for the arXiv preprint server.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link href="data:image/x-icon;base64,AAABAAEAEBACAAAAAACwAAAAFgAAACgAAAAQAAAAIAAAAAEAAQAAAAAAQAAAAAAAAAAAAAAAAgAAAAAAAAAAAAAA////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYAAAAAAAAACQAAAAAAAAAAAAADwDwAA+B8AAPw/AADsNwAAzDMAAMQjAADkJwAA4AcAAPAPAAD4HwAA8A8AAPAPAADwDwAA8A8AAPAPAADwDwAA" rel="icon" type="image/x-icon">
<style>
:root{
  color-scheme: light;
  --paper:#FFFFFF; --ink:#000000; --ink-soft:#5A5A5A; --faint:#8C8C8C; --panel:#F7F7F7; --link:#0B57D0;
  --font:"Roboto","Helvetica Neue",Arial,system-ui,sans-serif;
}
/* white page, black text, in both colour-scheme modes */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#FFFFFF; --ink:#000000; } }
:root[data-theme="dark"]{ --paper:#FFFFFF; --ink:#000000; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--ink);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

.page-wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,3vw,32px) 80px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:56px}
@media (max-width:960px){.page-wrap{grid-template-columns:minmax(0,1fr);gap:0}}

/* category browser */
.browse{position:sticky;top:0;align-self:start;padding-top:48px;font-size:.9rem;max-height:100vh;overflow:auto}
.browse p.label{font-weight:500;margin:0 0 8px;font-size:.92rem}
.browse details{margin:0 0 1px}
.browse summary{cursor:pointer;list-style:none;padding:4px 0;color:var(--ink)}
.browse summary::-webkit-details-marker{display:none}
.browse summary:hover{color:var(--ink-soft)}
.browse ul{list-style:none;margin:2px 0 8px;padding:0 0 0 12px}
.browse li button{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 0;color:var(--ink-soft);cursor:pointer;font-size:.86rem;line-height:1.4}
.browse li button:hover{color:var(--ink)}
.browse li button.on{color:var(--ink);font-weight:500}
@media (max-width:960px){.browse{position:static;max-height:none;padding-top:24px;margin-bottom:8px}}

article{min-width:0;max-width:820px}
.masthead{padding:48px 0 6px}
h1{font-weight:500;font-size:clamp(1.9rem,3.8vw,2.5rem);line-height:1.1;margin:0;letter-spacing:-.015em}
.meta{margin:12px 0 0;color:var(--ink-soft);font-size:.92rem}
h2{font-weight:500;font-size:1.5rem;line-height:1.3;margin:34px 0 10px}
p{margin:0 0 14px}
.note{color:var(--ink-soft)}

/* search */
.search{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 4px}
.search input[type=search]{flex:1;min-width:220px;background:var(--paper);border:1px solid #BDBDBD;border-radius:4px;padding:8px 11px}
.search button{border:1px solid var(--ink);background:var(--paper);border-radius:4px;padding:8px 15px;cursor:pointer;font-weight:500}
.search button:hover{background:var(--panel)}
.search .clear{border-color:#BDBDBD;font-weight:400}
.scope{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--ink-soft);font-size:.9rem;margin-bottom:6px}
.scope label{display:inline-flex;gap:7px;align-items:center;cursor:pointer}

/* results */
.entry{padding:18px 0 4px}
.entry h3{font-weight:500;font-size:1.08rem;line-height:1.4;margin:0 0 4px}
.entry .by{color:var(--ink-soft);font-size:.92rem;margin-bottom:2px}
.entry .when{color:var(--faint);font-size:.85rem;margin-bottom:8px}
.entry .cats{color:var(--faint);font-size:.82rem}
.entry .abstract{font-size:.95rem;line-height:1.6;max-width:72ch;margin:0 0 8px}
.entry .abstract.short{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.entry .links{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.entry .links a{color:var(--link)}
.entry .more{border:0;background:none;padding:0;color:var(--ink-soft);cursor:pointer;font-size:.9rem}
.entry .more:hover{color:var(--ink)}
mark{background:none;font-weight:500;color:var(--ink)}

/* pagination */
.pager{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:22px 0 0;font-size:.92rem}
.pager button{border:1px solid var(--ink);background:var(--paper);border-radius:4px;padding:5px 12px;cursor:pointer}
.pager button:hover:not(:disabled){background:var(--panel)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager .where{color:var(--ink-soft)}
.state{color:var(--ink-soft);padding:22px 0}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid var(--ink);border-top-color:transparent;border-radius:50%;animation:spin .9s linear infinite;margin-right:8px;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:1px solid #CFCFCF;background:var(--paper);border-radius:14px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.quick button:hover{border-color:var(--ink)}
footer{margin-top:56px;color:var(--faint);font-size:.9rem}
</style>
</head>
<body>
<div class="page-wrap">

<nav class="browse" aria-label="arXiv categories">
  <p class="label">Browse</p>
  <div id="taxonomy"></div>
</nav>

<article>
<header class="masthead">
  <h1>arXiv Explorer</h1>
  <p class="meta">A reader for the arXiv preprint server. Pick a category on the left, or search across all of arXiv.</p>
</header>

<div class="search">
  <input type="search" id="q" placeholder="Search titles, abstracts and authors" aria-label="Search arXiv">
  <button id="go" type="button">Search</button>
  <button id="clear" class="clear" type="button">Clear</button>
</div>
<div class="scope">
  <label><input type="checkbox" id="within" checked> Search inside the chosen category</label>
  <label>Sort
    <select id="sort">
      <option value="lastUpdatedDate">Most recently updated</option>
      <option value="submittedDate">Most recently submitted</option>
      <option value="relevance">Relevance</option>
    </select>
  </label>
</div>

<h2 id="heading">Latest preprints</h2>
<div class="quick" id="quick"></div>

<div id="state" class="state"></div>
<div id="results"></div>
<div id="pager" class="pager" hidden>
  <button id="first" type="button">First</button>
  <button id="prev" type="button">Previous</button>
  <span class="where" id="where"></span>
  <button id="next" type="button">Next</button>
  <button id="last" type="button">Last</button>
</div>

<footer>Data from the arXiv API. arXiv is operated by Cornell University; this page is an unaffiliated reader.</footer>
</article>
</div>

<script>
"use strict";

/* ---------------- arXiv taxonomy ---------------- */
var TAXONOMY = {
  "Computer science": [
    ["cs.AI", "Artificial intelligence"], ["cs.AR", "Hardware architecture"], ["cs.CC", "Computational complexity"],
    ["cs.CE", "Computational engineering, finance and science"], ["cs.CG", "Computational geometry"],
    ["cs.CL", "Computation and language"], ["cs.CR", "Cryptography and security"],
    ["cs.CV", "Computer vision and pattern recognition"], ["cs.CY", "Computers and society"], ["cs.DB", "Databases"],
    ["cs.DC", "Distributed and parallel computing"], ["cs.DL", "Digital libraries"], ["cs.DM", "Discrete mathematics"],
    ["cs.DS", "Data structures and algorithms"], ["cs.ET", "Emerging technologies"],
    ["cs.FL", "Formal languages and automata"], ["cs.GR", "Graphics"], ["cs.GT", "Computer science and game theory"],
    ["cs.HC", "Human-computer interaction"], ["cs.IR", "Information retrieval"], ["cs.IT", "Information theory"],
    ["cs.LG", "Machine learning"], ["cs.LO", "Logic in computer science"], ["cs.MA", "Multiagent systems"],
    ["cs.MM", "Multimedia"], ["cs.MS", "Mathematical software"], ["cs.NA", "Numerical analysis"],
    ["cs.NE", "Neural and evolutionary computing"], ["cs.NI", "Networking and internet architecture"],
    ["cs.OS", "Operating systems"], ["cs.PF", "Performance"], ["cs.PL", "Programming languages"],
    ["cs.RO", "Robotics"], ["cs.SC", "Symbolic computation"], ["cs.SD", "Sound"], ["cs.SE", "Software engineering"],
    ["cs.SI", "Social and information networks"], ["cs.SY", "Systems and control"]
  ],
  "Economics": [
    ["econ.EM", "Econometrics"], ["econ.GN", "General economics"], ["econ.TH", "Theoretical economics"]
  ],
  "Electrical engineering": [
    ["eess.AS", "Audio and speech processing"], ["eess.IV", "Image and video processing"],
    ["eess.SP", "Signal processing"], ["eess.SY", "Systems and control"]
  ],
  "Mathematics": [
    ["math.AC", "Commutative algebra"], ["math.AG", "Algebraic geometry"], ["math.AP", "Analysis of PDEs"],
    ["math.AT", "Algebraic topology"], ["math.CA", "Classical analysis and ODEs"], ["math.CO", "Combinatorics"],
    ["math.CT", "Category theory"], ["math.CV", "Complex variables"], ["math.DG", "Differential geometry"],
    ["math.DS", "Dynamical systems"], ["math.FA", "Functional analysis"], ["math.GN", "General topology"],
    ["math.GR", "Group theory"], ["math.GT", "Geometric topology"], ["math.HO", "History and overview"],
    ["math.KT", "K-theory and homology"], ["math.LO", "Logic"], ["math.MG", "Metric geometry"],
    ["math.NA", "Numerical analysis"], ["math.NT", "Number theory"], ["math.OC", "Optimisation and control"],
    ["math.PR", "Probability"], ["math.QA", "Quantum algebra"], ["math.RA", "Rings and algebras"],
    ["math.RT", "Representation theory"], ["math.SG", "Symplectic geometry"], ["math.SP", "Spectral theory"],
    ["math.ST", "Statistics theory"]
  ],
  "Physics": [
    ["astro-ph.CO", "Cosmology and nongalactic astrophysics"], ["astro-ph.EP", "Earth and planetary astrophysics"],
    ["astro-ph.GA", "Astrophysics of galaxies"], ["astro-ph.HE", "High energy astrophysical phenomena"],
    ["astro-ph.IM", "Instrumentation and methods"], ["astro-ph.SR", "Solar and stellar astrophysics"],
    ["cond-mat.dis-nn", "Disordered systems and neural networks"], ["cond-mat.mes-hall", "Mesoscale and nanoscale physics"],
    ["cond-mat.mtrl-sci", "Materials science"], ["cond-mat.quant-gas", "Quantum gases"],
    ["cond-mat.soft", "Soft condensed matter"], ["cond-mat.stat-mech", "Statistical mechanics"],
    ["cond-mat.str-el", "Strongly correlated electrons"], ["cond-mat.supr-con", "Superconductivity"],
    ["gr-qc", "General relativity and quantum cosmology"], ["hep-ex", "High energy physics, experiment"],
    ["hep-lat", "High energy physics, lattice"], ["hep-ph", "High energy physics, phenomenology"],
    ["hep-th", "High energy physics, theory"], ["math-ph", "Mathematical physics"],
    ["nlin.AO", "Adaptation and self-organising systems"], ["nlin.CD", "Chaotic dynamics"],
    ["nlin.PS", "Pattern formation and solitons"], ["nlin.SI", "Exactly solvable and integrable systems"],
    ["nucl-ex", "Nuclear experiment"], ["nucl-th", "Nuclear theory"], ["physics.ao-ph", "Atmospheric and oceanic physics"],
    ["physics.app-ph", "Applied physics"], ["physics.atom-ph", "Atomic physics"], ["physics.bio-ph", "Biological physics"],
    ["physics.chem-ph", "Chemical physics"], ["physics.comp-ph", "Computational physics"],
    ["physics.data-an", "Data analysis, statistics and probability"], ["physics.flu-dyn", "Fluid dynamics"],
    ["physics.geo-ph", "Geophysics"], ["physics.hist-ph", "History and philosophy of physics"],
    ["physics.ins-det", "Instrumentation and detectors"], ["physics.med-ph", "Medical physics"],
    ["physics.optics", "Optics"], ["physics.plasm-ph", "Plasma physics"], ["physics.soc-ph", "Physics and society"],
    ["physics.space-ph", "Space physics"], ["quant-ph", "Quantum physics"]
  ],
  "Quantitative biology": [
    ["q-bio.BM", "Biomolecules"], ["q-bio.CB", "Cell behaviour"], ["q-bio.GN", "Genomics"],
    ["q-bio.MN", "Molecular networks"], ["q-bio.NC", "Neurons and cognition"],
    ["q-bio.PE", "Populations and evolution"], ["q-bio.QM", "Quantitative methods"],
    ["q-bio.SC", "Subcellular processes"], ["q-bio.TO", "Tissues and organs"]
  ],
  "Quantitative finance": [
    ["q-fin.CP", "Computational finance"], ["q-fin.EC", "Economics"], ["q-fin.GN", "General finance"],
    ["q-fin.MF", "Mathematical finance"], ["q-fin.PM", "Portfolio management"], ["q-fin.PR", "Pricing of securities"],
    ["q-fin.RM", "Risk management"], ["q-fin.ST", "Statistical finance"], ["q-fin.TR", "Trading and market microstructure"]
  ],
  "Statistics": [
    ["stat.AP", "Applications"], ["stat.CO", "Computation"], ["stat.ME", "Methodology"],
    ["stat.ML", "Machine learning"], ["stat.TH", "Statistics theory"]
  ]
};

var QUICK = [["q-fin.ST", "Statistical finance"], ["q-fin.TR", "Trading and microstructure"],
             ["cs.LG", "Machine learning"], ["econ.EM", "Econometrics"],
             ["astro-ph.IM", "Astronomy instrumentation"], ["math.PR", "Probability"]];

/* ---------------- state ---------------- */
var PAGE_SIZE = 10, MAX_RESULTS = 100;
var papers = [], page = 1, category = "", categoryName = "", query = "", loading = false;
var LABELS = {};
Object.keys(TAXONOMY).forEach(function (g) { TAXONOMY[g].forEach(function (c) { LABELS[c[0]] = c[1]; }); });

var $ = function (id) { return document.getElementById(id); };
function esc (s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c];
  });
}
function tidy (s) { return String(s || "").replace(/\s+/g, " ").trim(); }
function formatDate (iso) {
  var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var parts = String(iso).split("T")[0].split("-");
  if (parts.length !== 3) return iso;
  return parseInt(parts[2], 10) + " " + months[parseInt(parts[1], 10) - 1] + " " + parts[0];
}

/* ---------------- fetching ---------------- */
function buildQuery () {
  var terms = [];
  if (category && (!query || $("within").checked)) terms.push("cat:" + category);
  if (query) terms.push("all:" + JSON.stringify(query).slice(1, -1));
  if (!terms.length) terms.push("cat:" + (category || "q-fin.ST"));
  return terms.join(" AND ");
}

function load () {
  if (loading) return;
  loading = true;
  papers = [];
  page = 1;
  $("results").innerHTML = "";
  $("pager").hidden = true;
  $("state").innerHTML = '<span class="spinner"></span>Asking arXiv\u2026';

  var arxivUrl = "https://export.arxiv.org/api/query?search_query=" + encodeURIComponent(buildQuery()) +
    "&sortBy=" + encodeURIComponent($("sort").value) + "&sortOrder=descending&start=0&max_results=" + MAX_RESULTS;

  // Use /get instead of /raw to ensure CORS headers are always attached
  var url = "https://api.allorigins.win/get?url=" + encodeURIComponent(arxivUrl);

  fetch(url).then(function (r) {
    if (!r.ok) throw new Error("arXiv answered with " + r.status);
    return r.json(); // 1. Parse the proxy's JSON response
  }).then(function (data) {
    var text = data.contents; // 2. Extract the raw XML string from the proxy payload
    var xml = new DOMParser().parseFromString(text, "text/xml");
    
    if (xml.querySelector("parsererror")) throw new Error("The answer from arXiv could not be read.");
    
    papers = [].slice.call(xml.querySelectorAll("entry")).map(function (e) {
      function first (sel) { var n = e.querySelector(sel); return n ? n.textContent : ""; }
      var abs = first("id");
      return {
        title: tidy(first("title")),
        authors: [].slice.call(e.querySelectorAll("author name")).map(function (n) { return tidy(n.textContent); }),
        published: first("published"),
        updated: first("updated"),
        abstract: tidy(first("summary")),
        abs: abs,
        pdf: abs.replace("/abs/", "/pdf/"),
        cats: [].slice.call(e.querySelectorAll("category")).map(function (c) { return c.getAttribute("term"); })
      };
    });
    loading = false;
    render();
  }).catch(function (err) {
    loading = false;
    $("state").innerHTML = "arXiv could not be reached: " + esc(err.message) +
      ". Try again in a moment, or open <a href='https://arxiv.org/list/" + esc(category || "q-fin.ST") +
      "/recent' target='_blank' rel='noopener'>the listing on arxiv.org</a>.";
  });
}

/* ---------------- rendering ---------------- */
function highlight (text) {
  if (!query) return esc(text);
  var terms = query.split(/\s+/).filter(function (t) { return t.length > 2; })
    .map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); });
  if (!terms.length) return esc(text);
  return esc(text).replace(new RegExp("(" + terms.join("|") + ")", "gi"), "<mark>$1</mark>");
}

function authorLine (authors) {
  if (authors.length <= 6) return authors.join(", ");
  return authors.slice(0, 6).join(", ") + " and " + (authors.length - 6) + " others";
}

function render () {
  var total = papers.length;
  var heading = query
    ? "\u201c" + query + "\u201d" + (category && $("within").checked ? " in " + (categoryName || category) : " across arXiv")
    : (categoryName ? categoryName : "Statistical finance");
  $("heading").textContent = heading;

  if (!total) {
    $("state").textContent = query ? "Nothing matched that search." : "No preprints came back for this category.";
    $("pager").hidden = true;
    return;
  }

  var pages = Math.ceil(total / PAGE_SIZE);
  if (page > pages) page = pages;
  $("state").textContent = total + (total === MAX_RESULTS ? " most recent" : "") + " preprints" +
    (category && (!query || $("within").checked) ? " in " + category : "") + ".";

  var slice = papers.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  $("results").innerHTML = slice.map(function (p, i) {
    var id = "abs-" + i;
    return '<div class="entry">' +
      "<h3>" + highlight(p.title) + "</h3>" +
      '<div class="by">' + esc(authorLine(p.authors)) + "</div>" +
      '<div class="when">Submitted ' + esc(formatDate(p.published)) +
        (p.updated && p.updated !== p.published ? ", updated " + esc(formatDate(p.updated)) : "") +
        (p.cats.length ? ' <span class="cats">\u00b7 ' + esc(p.cats.slice(0, 4).join(", ")) + "</span>" : "") + "</div>" +
      '<p class="abstract short" id="' + id + '">' + highlight(p.abstract) + "</p>" +
      '<div class="links">' +
        '<a href="' + esc(p.abs) + '" target="_blank" rel="noopener">Abstract page</a>' +
        '<a href="' + esc(p.pdf) + '" target="_blank" rel="noopener">PDF</a>' +
        '<button class="more" type="button" data-target="' + id + '">Show full abstract</button>' +
      "</div></div>";
  }).join("");

  [].slice.call($("results").querySelectorAll(".more")).forEach(function (b) {
    b.addEventListener("click", function () {
      var p = $(b.getAttribute("data-target"));
      var open = p.classList.toggle("short");
      b.textContent = open ? "Show full abstract" : "Show less";
    });
  });

  $("pager").hidden = false;
  $("where").textContent = "Page " + page + " of " + pages;
  $("first").disabled = $("prev").disabled = page === 1;
  $("next").disabled = $("last").disabled = page === pages;
  window.pagesTotal = pages;
}

function goTo (p) {
  if (p < 1 || p > window.pagesTotal) return;
  page = p;
  render();
  $("heading").scrollIntoView({block: "start"});
}

/* ---------------- browse panel ---------------- */
function buildTaxonomy () {
  var box = $("taxonomy");
  box.innerHTML = Object.keys(TAXONOMY).map(function (group) {
    var items = TAXONOMY[group].map(function (c) {
      return "<li><button type='button' data-cat='" + c[0] + "'>" + esc(c[1]) + "</button></li>";
    }).join("");
    return "<details><summary>" + esc(group) + "</summary><ul>" + items + "</ul></details>";
  }).join("");

  box.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-cat]");
    if (!b) return;
    pickCategory(b.getAttribute("data-cat"));
  });

  $("quick").innerHTML = QUICK.map(function (c) {
    return "<button type='button' data-cat='" + c[0] + "'>" + esc(c[1]) + "</button>";
  }).join("");
  $("quick").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-cat]");
    if (b) pickCategory(b.getAttribute("data-cat"));
  });
}

function pickCategory (code) {
  category = code;
  categoryName = LABELS[code] || code;
  [].slice.call(document.querySelectorAll("#taxonomy button")).forEach(function (b) {
    b.classList.toggle("on", b.getAttribute("data-cat") === code);
  });
  var open = document.querySelector("#taxonomy button.on");
  if (open) { var d = open.closest("details"); if (d) d.open = true; }
  load();
}

/* ---------------- events ---------------- */
$("go").addEventListener("click", function () { query = tidy($("q").value); load(); });
$("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { query = tidy($("q").value); load(); } });
$("clear").addEventListener("click", function () { $("q").value = ""; query = ""; load(); });
$("sort").addEventListener("change", load);
$("within").addEventListener("change", function () { if (query) load(); });
$("first").addEventListener("click", function () { goTo(1); });
$("prev").addEventListener("click", function () { goTo(page - 1); });
$("next").addEventListener("click", function () { goTo(page + 1); });
$("last").addEventListener("click", function () { goTo(window.pagesTotal); });

buildTaxonomy();
pickCategory("q-fin.ST");
</script>
</body>
</html>
